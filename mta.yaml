_schema-version: "3.3"
ID: mantenimiento
description: |
  Dashboard de Mantenimiento SAPUI5 conectado directamente al servicio OData ZPM_BTP_DASHMANTTO_SRV mediante la Destination QAS_MITSU_DASH.
version: 0.0.1
modules:
- name: mantenimiento
  type: html5
  path: .
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: mantenimiento-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: mantenimiento-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - mantenimiento.zip
      name: mantenimiento
      target-path: resources/
- name: mantenimiento-destination-content
  type: com.sap.application.content
  requires:
  - name: mantenimiento-destination-service
    parameters:
      content-target: true
  - name: mantenimiento-html5-repo-host
    parameters:
      service-key:
        name: mantenimiento-html5-repo-host-key
  - name: mantenimiento-xsuaa
    parameters:
      service-key:
        name: mantenimiento-xsuaa-key
  parameters:
    content:
      instance:
        destinations:
        - Name: mantenimiento-html5-repo-host
          ServiceInstanceName: mantenimiento-html5-repo-host
          ServiceKeyName: mantenimiento-html5-repo-host-key
          sap.cloud.service: mantenimiento
        - Authentication: OAuth2UserTokenExchange
          Name: mantenimiento-xsuaa
          ServiceInstanceName: mantenimiento-xsuaa
          ServiceKeyName: mantenimiento-xsuaa-key
          sap.cloud.service: mantenimiento
        existing_destinations_policy: update
  build-parameters:
    no-source: true
resources:
- name: mantenimiento-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: mantenimiento-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-plan: lite
- name: mantenimiento-xsuaa
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
